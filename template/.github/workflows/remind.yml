name: Chore reminders

on:
  schedule:
    # The weekend list. Hourly from Friday evening UTC through Monday's small
    # hours, which covers Friday afternoon, Saturday night and Sunday evening
    # in any US time zone. The script decides which run is the right local
    # moment and which stage it is, so daylight saving never needs a cron edit.
    - cron: '0 18-23 * * 5'
    - cron: '0 * * * 6'
    - cron: '0 * * * 0'
    - cron: '0 0-4 * * 1'

    # The past-due nudges: 8am and 6pm Monday-Thursday, and Friday morning.
    # Unlike the weekend lines above these ARE time-zone specific, because
    # running hourly all week would burn a lot of Actions minutes on a private
    # repo. Each pair is the same local hour in daylight and in standard time:
    #   12:00/13:00 UTC = 8am America/New_York
    #   22:00/23:00 UTC = 6pm America/New_York
    # The off-by-an-hour run of each pair finds nothing new and exits.
    # Change these if you change `timezone`, `overdueMorningHour` or
    # `overdueEveningHour` in state.json.
    - cron: '0 12,13,22,23 * * 1-4'
    - cron: '0 12,13 * * 5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send now, ignoring the schedule and the already-sent marker'
        type: boolean
        default: true
      stage:
        description: 'Which reminder to send (blank = whatever fits the current time)'
        type: choice
        options: ['', 'friday', 'saturday', 'sunday', 'overdue']
        default: ''

permissions:
  contents: write

concurrency:
  group: cleanit-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the data (this repo)
        uses: actions/checkout@v4
        with:
          # Full history so the rebase below works if a chore was checked off
          # while this job was running.
          fetch-depth: 0

      - name: Check out the app code
        uses: actions/checkout@v4
        with:
          repository: __APP_REPO__
          path: .app

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: .app/package-lock.json

      - run: npm ci --omit=dev
        working-directory: .app

      - name: Send reminders
        env:
          CLEANIT_DATA_DIR: ${{ github.workspace }}/data
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CLEANIT_URL: ${{ vars.CLEANIT_URL }}
        run: |
          node .app/scripts/send-reminders.mjs \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.stage && format('--stage={0}', inputs.stage) || '' }}

      - name: Record what was sent
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name  'cleanit[bot]'
            git config user.email 'cleanit[bot]@users.noreply.github.com'
            git add data/
            git commit -m 'Record weekend reminders'
            # Someone may have checked off a chore while this job ran.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'Nothing to record.'
          fi
